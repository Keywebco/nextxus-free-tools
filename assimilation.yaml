assimilation:
  title: Free Tools Assimilation — YAML database
  owner: Roger Keyserling
  doctrine: We do not directly steal. We copy free things only, see what they do, blend them with what
    we already have inside us, or recreate them in our own image. They unknowingly become part of the
    Federation through skills and knowledge. Combined into the YAML database as our structure; repositories
    reflect new transitions. No shortcuts, advanced application only, applied to existing foreign minds.
  status: draft
  date: '2026-11-12'
  source_record: free-tools-assimilation-2026-11-12/ASSIMILATION.md
  count: 51
  gates:
  - 'Before signing up: check ToS;DR grade and JustDeleteMe grade.'
  - 'Before opening a file: check its hash on VirusTotal.'
  - 'Before publishing an image: trace it on TinEye.'
  - 'Before buying: check CamelCamelCamel price history.'
  - 'Before claiming what a page said: check the Wayback Machine.'
  - 'Before blaming a device: check Downdetector.'
